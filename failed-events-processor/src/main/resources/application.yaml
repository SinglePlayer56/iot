server:
  port: 8204

spring:
  application:
    name: failed-events-processor

  kafka:
    bootstrap-servers: ${KAFKA_ADDRESS:localhost:9094}
    properties:
      schema.registry.url: http://${SCHEMA_REGISTRY_ADDRESS:localhost:8081}
      specific.avro.reader: true

    listener:
      type: batch
      ack-mode: manual
      poll-timeout: 1000
      concurrency: 4

    dlt-topic: dlt-topic

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      enable-auto-commit: false
      max-poll-records: 100
      group-id: failed-events-processor-group
      auto-offset-reset: earliest
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

minio:
  host: ${MINIO_HOST:http://127.0.0.1:9000}
  username: ${MINIO_ROOT_USER:minio1234}
  password: ${MINIO_ROOT_PASSWORD:minio1234}
  bucket-name: ${MINIO_BACKET_NAME:failed-events-processor}

management:
  server:
    port: ${server.port}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:my-app}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}