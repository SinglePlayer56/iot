dataSources:
  shard_master_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    jdbcUrl: jdbc:postgresql://${SHARD_0_MASTER_URL:localhost:5434}/${POSTGRES_DEVICES_DB_NAME:devices}
    username: ${POSTGRES_DEVICES_USER_SHARD_0_MASTER:postgres}
    password: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_MASTER:postgres}

  shard_replica_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    jdbcUrl: jdbc:postgresql://${SHARD_0_REPLICA_URL:localhost:5438}/${POSTGRES_DEVICES_DB_NAME:devices}
    username: ${POSTGRES_DEVICES_USER_SHARD_0_REPLICA:postgres}
    password: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_REPLICA:postgres}

  shard_master_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    jdbcUrl: jdbc:postgresql://${SHARD_1_MASTER_URL:localhost:5437}/${POSTGRES_DEVICES_DB_NAME:devices}
    username: ${POSTGRES_DEVICES_USER_SHARD_1_MASTER:postgres}
    password: ${POSTGRES_DEVICES_PASSWORD_SHARD_1_MASTER:postgres}

rules:
  - !READWRITE_SPLITTING
    dataSourceGroups:
      shard0:
        writeDataSourceName: shard_master_0
        readDataSourceNames: [ shard_master_0, shard_replica_0 ]
        loadBalancerName: round_robin
      shard1:
        writeDataSourceName: shard_master_1
        readDataSourceNames: [ shard_master_1 ]
        loadBalancerName: round_robin
    loadBalancers:
      round_robin:
        type: ROUND_ROBIN

  - !SHARDING
    tables:
      devices:
        actualDataNodes: shard${0..1}.devices
        tableStrategy:
          none:
        databaseStrategy:
          standard:
            shardingColumn: device_id
            shardingAlgorithmName: deviceid_hash_mod
    shardingAlgorithms:
      deviceid_hash_mod:
        type: INLINE
        props:
          algorithm-expression: shard${Math.abs(device_id.hashCode()) % 2}

props:
  sql-show: true