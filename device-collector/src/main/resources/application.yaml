server:
  port: 8201

spring:
  application:
    name: device-collector

  kafka:
    bootstrap-servers: ${KAFKA_ADDRESS:localhost:9094}
    properties:
      schema.registry.url: http://${SCHEMA_REGISTRY_ADDRESS:localhost:8081}
      specific.avro.reader: true

    listener:
      type: batch
      ack-mode: manual
      poll-timeout: 1000
      concurrency: 4

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: false
        acks: all
        enable.idempotence: true

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      enable-auto-commit: false
      max-poll-records: 100
      read-topic: devices
      group-id: devices-collector-group
      auto-offset-reset: earliest
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml

  flyway:
    enabled: false
    dataSources:
      - url: jdbc:postgresql://${SHARD_0_MASTER_URL:localhost:5434}/${POSTGRES_DEVICES_DB_NAME:devices}
        username: ${POSTGRES_DEVICES_USER_SHARD_0_MASTER:postgres}
        password: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_MASTER:postgres}
      - url: jdbc:postgresql://${SHARD_1_MASTER_URL:localhost:5437}/${POSTGRES_DEVICES_DB_NAME:devices}
        username: ${POSTGRES_DEVICES_USER_SHARD_1_MAIN:postgres}
        password: ${POSTGRES_DEVICES_PASSWORD_SHARD_1_MAIN:postgres}

management:
  server:
    port: ${server.port}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:my-app}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}