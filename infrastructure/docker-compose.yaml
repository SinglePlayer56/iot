services:
  postgres_commands:
    image: postgres:17
    container_name: postgres_commands
    restart: unless-stopped
    ports:
      - "5433:5432"
    networks:
      - iot_network
    volumes:
      - postgres_commands_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_COMMANDS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_COMMANDS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_COMMANDS_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_COMMANDS_USER}" ]
      interval: 10s
      retries: 5

  postgres-devices-shard-0-master:
    image: postgres:17
    container_name: postgres-devices-shard-0-master
    restart: unless-stopped
    ports:
      - "5434:5432"
    networks:
      - iot_network
    volumes:
      - postgres-devices-data-shard-0-master:/var/lib/postgresql/data
      - ${PROJECT_DIR:-.}/postgresql/init-master.sh:/docker-entrypoint-initdb.d/00-init-master.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_DEVICES_USER_SHARD_0_MASTER}
      POSTGRES_PASSWORD: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_MASTER}
      POSTGRES_DB: ${POSTGRES_DEVICES_DB_NAME}
      REPL_USER: ${POSTGRES_REPLICATION_USER}
      REPL_PASS: ${POSTGRES_REPLICATION_PASSWORD}
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c wal_keep_size=128
               -c hot_standby=on
               -c listen_addresses='*'
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_DEVICES_USER_SHARD_0_MASTER}" ]
      interval: 10s
      retries: 5

  postgres-devices-shard-1-master:
    image: postgres:17
    container_name: postgres-devices-shard-1-master
    restart: unless-stopped
    ports:
      - "5437:5432"
    networks:
      - iot_network
    volumes:
      - postgres-devices-data-shard-1-master:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_DEVICES_USER_SHARD_1_MASTER}
      POSTGRES_PASSWORD: ${POSTGRES_DEVICES_PASSWORD_SHARD_1_MASTER}
      POSTGRES_DB: ${POSTGRES_DEVICES_DB_NAME}
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c wal_keep_size=128
               -c hot_standby=on
               -c listen_addresses='*'
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_DEVICES_USER_SHARD_1_MASTER}" ]
      interval: 10s
      retries: 5

  postgres-devices-shard-0-replica:
    image: postgres:17
    container_name: postgres-devices-shard-0-replica
    restart: unless-stopped
    ports:
      - "5438:5432"
    networks:
      - iot_network
    depends_on:
      postgres-devices-shard-0-master:
        condition: service_healthy
    volumes:
      - postgres-devices-data-shard-0-replica:/var/lib/postgresql/data
      - ${PROJECT_DIR:-.}/postgresql/replica-init.sh:/docker-entrypoint-initdb.d/00-replica-init.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_DEVICES_USER_SHARD_0_REPLICA}
      POSTGRES_PASSWORD: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_REPLICA}
      POSTGRES_DB: ${POSTGRES_DEVICES_DB_NAME}
      REPL_USER: ${POSTGRES_REPLICATION_USER}
      REPL_PASS: ${POSTGRES_REPLICATION_PASSWORD}
      MASTER_HOST: postgres-devices-shard-0-master
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_DEVICES_USER_SHARD_0_REPLICA}" ]
      interval: 10s
      retries: 5

  postgres_keycloak:
    image: postgres:17
    container_name: postgres_keycloak
    restart: unless-stopped
    ports:
      - "5435:5432"
    networks:
      - iot_network
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_KEYCLOAK_USER}" ]
      interval: 10s
      retries: 5

  postgres_camunda:
    image: postgres:17
    container_name: postgres_camunda
    restart: unless-stopped
    ports:
      - "5436:5432"
    networks:
      - iot_network
    volumes:
      - postgres_camunda_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_CAMUNDA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CAMUNDA_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CAMUNDA_DB}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_CAMUNDA_USER}" ]
      interval: 10s
      retries: 5

  redis:
    image: redis:8.2.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - iot_network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - iot_network
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres_keycloak
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KC_DB_URL_DATABASE: ${POSTGRES_KEYCLOAK_DB}
      KC_HOSTNAME: ${KEYCLOAK_HOST:-localhost}
      KC_HOSTNAME_ADMIN_URL: http://${KEYCLOAK_HOST:-localhost}:8080

      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/healthy/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.5
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - iot_network
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      ALLOW_PLAINTEXT_LISTENER: yes
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      interval: 10s
      retries: 5
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.5
    container_name: schema-registry
    ports:
      - "8081:8081"
    networks:
      - iot_network
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - schema_registry_data:/etc/schema-registry
      - ${PROJECT_DIR:-.}/monitoring/schema-registry/schema-registry-jmx.yml:/opt/jmx/schema-registry-jmx.yml:ro
      - ${PROJECT_DIR:-.}/monitoring/prometheus/jmx/jmx_prometheus_javaagent-1.5.0.jar:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar:ro
    environment:
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: ${SCHEMA_REGISTRY_HOST_NAME}
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_MIN_INSYNC_REPLICAS: 1
      SCHEMA_REGISTRY_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar=9404:/opt/jmx/schema-registry-jmx.yml
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/subjects" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8070:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - iot_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      JVM_EXTRA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar=9500:/opt/jmx/cassandra-jmx.yml
    networks:
      - iot_network
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ${PROJECT_DIR:-.}/monitoring/prometheus/jmx/jmx_prometheus_javaagent-1.5.0.jar:/opt/jmx/jmx_prometheus_javaagent-1.5.0.jar:ro
      - ${PROJECT_DIR:-.}/monitoring/cassandra/cassandra-jmx.yml:/opt/jmx/cassandra-jmx.yml:ro
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' localhost 9042 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  camunda:
    image: camunda/camunda-bpm-platform:7.24.0
    container_name: camunda
    depends_on:
      postgres_camunda:
        condition: service_healthy
    ports:
      - "8088:8080"
    networks:
      - iot_network
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres_camunda:5432/${POSTGRES_CAMUNDA_DB}
      DB_USERNAME: ${POSTGRES_CAMUNDA_USER}
      DB_PASSWORD: ${POSTGRES_CAMUNDA_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/engine-rest/engine | grep -q 'name'" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9001:9001"
    networks:
      - iot_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - iot_network
    volumes:
      - ${PROJECT_DIR:-.}/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - iot_network
    volumes:
      - ${PROJECT_DIR:-.}/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    ports:
      - "9080:9080"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP http
    networks:
      - iot_network
    volumes:
      - ${PROJECT_DIR:-.}/monitoring/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9080/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    networks:
      - iot_network
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ${PROJECT_DIR:-.}/monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3200/status" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - iot_network
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    volumes:
      - ${PROJECT_DIR:-.}/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ${PROJECT_DIR:-.}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter-commands:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-commands
    networks:
      - iot_network
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_COMMANDS_USER}:${POSTGRES_COMMANDS_PASSWORD}@postgres_commands:5432/${POSTGRES_COMMANDS_DB}?sslmode=disable
    depends_on:
      postgres_commands:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter-devices-shard-0-master:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-devices-shard-0-master
    networks:
      - iot_network
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_DEVICES_USER_SHARD_0_MASTER}:${POSTGRES_DEVICES_PASSWORD_SHARD_0_MASTER}@postgres-devices-shard-0-master:5432/${POSTGRES_DEVICES_DB_NAME}?sslmode=disable
    depends_on:
      postgres-devices-shard-0-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter-devices-shard-1-master:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-devices-shard-1-master
    networks:
      - iot_network
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_DEVICES_USER_SHARD_1_MASTER}:${POSTGRES_DEVICES_PASSWORD_SHARD_1_MASTER}@postgres-devices-shard-1-master:5432/${POSTGRES_DEVICES_DB_NAME}?sslmode=disable
    depends_on:
      postgres-devices-shard-1-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter-devices-shard-0-replica:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-devices-shard-0-replica
    networks:
      - iot_network
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_DEVICES_USER_SHARD_0_REPLICA}:${POSTGRES_DEVICES_PASSWORD_SHARD_0_REPLICA}@postgres-devices-shard-0-replica:5432/${POSTGRES_DEVICES_DB_NAME}?sslmode=disable
    depends_on:
      postgres-devices-shard-0-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter-keycloak:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-keycloak
    networks:
      - iot_network
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_KEYCLOAK_USER}:${POSTGRES_KEYCLOAK_PASSWORD}@postgres_keycloak:5432/${POSTGRES_KEYCLOAK_DB}?sslmode=disable
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter-camunda:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-camunda
    networks:
      - iot_network
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_CAMUNDA_USER}:${POSTGRES_CAMUNDA_PASSWORD}@postgres_camunda:5432/${POSTGRES_CAMUNDA_DB}?sslmode=disable
    depends_on:
      postgres_camunda:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    networks:
      - iot_network
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9308/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "9121:9121"
    networks:
      - iot_network
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9121/metrics" ]
      interval: 10s
      retries: 5

  docker-proxy:
    image: alpine/socat
    command:
      - TCP-LISTEN:2375,fork
      - UNIX-CONNECT:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2375:2375"
    networks:
      - iot_network

  event-collector:
    image: event-collector:latest
    container_name: event-collector
    build:
      context: ../event-collector
      dockerfile: ../event-collector/Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        NEXUS_URL: http://host.docker.internal:8085/repository/maven-releases/
        NEXUS_USERNAME: ${NEXUS_USERNAME}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}
        TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
        DOCKER_HOST: host.docker.internal:2375
    ports:
      - "8200:8200"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
      KAFKA_ADDRESS: kafka:9092
      SCHEMA_REGISTRY_ADDRESS: schema-registry:8081
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    networks:
      - iot_network

  device-collector:
    image: device-collector:latest
    container_name: device-collector
    build:
      context: ../device-collector
      dockerfile: ../device-collector/Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        NEXUS_URL: http://host.docker.internal:8085/repository/maven-releases/
        NEXUS_USERNAME: ${NEXUS_USERNAME}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}
        TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
        DOCKER_HOST: host.docker.internal:2375
    ports:
      - "8201:8201"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=docker
      KAFKA_ADDRESS: kafka:9092
      SCHEMA_REGISTRY_ADDRESS: schema-registry:8081
      POSTGRES_DEVICES_DB_NAME: ${POSTGRES_DEVICES_DB_NAME}
      SHARD_0_MASTER_URL: postgres-devices-shard-0-master:5432
      SHARD_0_REPLICA_URL: postgres-devices-shard-0-replica:5432
      SHARD_1_MASTER_URL: postgres-devices-shard-1-master:5432
      POSTGRES_DEVICES_USER_SHARD_0_MASTER: ${POSTGRES_DEVICES_USER_SHARD_0_MASTER}
      POSTGRES_DEVICES_PASSWORD_SHARD_0_MASTER: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_MASTER}
      POSTGRES_DEVICES_USER_SHARD_0_REPLICA: ${POSTGRES_DEVICES_USER_SHARD_0_REPLICA}
      POSTGRES_DEVICES_PASSWORD_SHARD_0_REPLICA: ${POSTGRES_DEVICES_PASSWORD_SHARD_0_REPLICA}
      POSTGRES_DEVICES_USER_SHARD_1_MASTER: ${POSTGRES_DEVICES_USER_SHARD_1_MASTER}
      POSTGRES_DEVICES_PASSWORD_SHARD_1_MASTER: ${POSTGRES_DEVICES_PASSWORD_SHARD_1_MASTER}
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres-devices-shard-0-master:
        condition: service_healthy
      postgres-devices-shard-0-replica:
        condition: service_healthy
      postgres-devices-shard-1-master:
        condition: service_healthy
    networks:
      - iot_network

  nexus:
    image: sonatype/nexus3:3.85.0
    container_name: nexus
    ports:
      - "8085:8081"
    networks:
      - iot_network
    volumes:
      - nexus-data:/nexus-data
    environment:
      NEXUS_SECURITY_INITIAL_PASSWORD: ${NEXUS_PASSWORD}
      NEXUS_SECURITY_RANDOMPASSWORD: false
      INSTALL4J_ADD_VM_PARAMS: -Xms256m -Xmx1024m -XX:MaxDirectMemorySize=2g
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status" ]
      interval: 5s
      timeout: 10s
      retries: 30

  avro-shared-library-publisher:
    build:
      context: ../avro-shared-library
      dockerfile: Dockerfile
      args:
        NEXUS_URL: http://host.docker.internal:8085/repository/maven-releases/
        NEXUS_USERNAME: ${NEXUS_USERNAME}
        NEXUS_PASSWORD: ${NEXUS_PASSWORD}
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      - iot_network
    restart: "no"

networks:
  iot_network:
    driver: bridge

volumes:
  cassandra-data:
  postgres_commands_data:
  postgres_keycloak_data:
  kafka_data:
  schema_registry_data:
  postgres_camunda_data:
  grafana-storage:
  tempo_data:
  nexus-data:
  postgres-devices-data-shard-0-master:
  postgres-devices-data-shard-1-master:
  postgres-devices-data-shard-0-replica:
  etcd-data:
