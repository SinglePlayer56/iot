global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "prometheus:9090" ]

  - job_name: postgres-exporter-commands
    static_configs:
      - targets: [ 'postgres-exporter-commands:9187' ]

  - job_name: postgres-exporter-devices
    static_configs:
      - targets: [ 'postgres-exporter-devices:9187' ]

  - job_name: postgres-exporter-keycloak
    static_configs:
      - targets: [ 'postgres-exporter-keycloak:9187' ]

  - job_name: postgres-exporter-camunda
    static_configs:
      - targets: [ 'postgres-exporter-camunda:9187' ]

  - job_name: kafka-exporter
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [ 'keycloak:9000' ]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: [ 'grafana:3000' ]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: [ 'alloy:9080' ]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: [ 'loki:3100' ]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: [ 'tempo:3200' ]

  - job_name: redis-exporter
    static_configs:
      - targets: [ 'redis-exporter:9121' ]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [ 'minio:9000' ]